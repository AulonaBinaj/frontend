<div class="p-6 max-w-xl mx-auto">
  <h2 class="text-2xl font-bold mb-4">Items List</h2>

  <!-- Form për të shtuar item -->
  <form (ngSubmit)="addItem()" class="mb-4 flex gap-2">
    <input
      type="text"
      placeholder="Item name"
      [(ngModel)]="newItem.name"
      name="name"
      class="flex-1 p-2 border rounded"
    />
    <input
      type="text"
      placeholder="Description"
      [(ngModel)]="newItem.description"
      name="description"
      class="flex-1 p-2 border rounded"
    />
    <button
      type="submit"
      class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600"
    >
      Add
    </button>
  </form>

  <!-- Lista e items -->
  <ul>
    <li
      *ngFor="let item of items"
      class="mb-2 p-2 border rounded flex justify-between items-center"
    >
      <div class="flex-1">
        <!-- Inline edit -->
        <div *ngIf="editingId !== item._id">
          <span class="font-semibold">{{ item.name }}</span> -
          {{ item.description }}
        </div>
        <div *ngIf="editingId === item._id" class="flex gap-2">
          <input
            [(ngModel)]="editingItem.name"
            name="editName"
            class="p-1 border rounded flex-1"
          />
          <input
            [(ngModel)]="editingItem.description"
            name="editDesc"
            class="p-1 border rounded flex-1"
          />
        </div>
      </div>

      <!-- Buttons -->
      <div class="flex gap-2">
        <button
          *ngIf="editingId !== item._id"
          (click)="startEdit(item)"
          class="bg-yellow-500 text-white px-2 py-1 rounded hover:bg-yellow-600"
        >
          Edit
        </button>
        <button
          *ngIf="editingId === item._id"
          (click)="saveEdit(item._id!)"
          class="bg-blue-500 text-white px-2 py-1 rounded hover:bg-blue-600"
        >
          Save
        </button>
        <button
          (click)="deleteItem(item._id!)"
          class="bg-red-500 text-white px-2 py-1 rounded hover:bg-red-600"
        >
          Delete
        </button>
      </div>
    </li>
  </ul>
</div>
