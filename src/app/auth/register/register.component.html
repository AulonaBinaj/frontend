<h2>Register</h2>
<form (ngSubmit)="onRegister()" class="auth-form">
  <input
    type="text"
    placeholder="Username"
    [(ngModel)]="username"
    name="username"
    required
  />
  <input
    type="password"
    placeholder="Password"
    [(ngModel)]="password"
    name="password"
    required
  />
  <button type="submit">Register</button>
</form>
<p>Already have an account? <a routerLink="/login">Login</a></p>
