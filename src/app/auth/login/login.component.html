<h2>Login</h2>
<form (ngSubmit)="onLogin()" class="auth-form">
  <input
    type="text"
    placeholder="Username"
    [(ngModel)]="username"
    name="username"
    required
  />
  <input
    type="password"
    placeholder="Password"
    [(ngModel)]="password"
    name="password"
    required
  />
  <button type="submit">Login</button>
</form>

<p>
  Don't have an account?
  <a [routerLink]="['/register']">Register</a>
</p>
