name: Front End, Test CI/CD

on:
  push:
    branches:
      - dev

jobs:
  Hello:
    runs-on: ubuntu-latest

   steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app
        run: npm run build
